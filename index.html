<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>विभक्तिक्रीडा — Sanskrit case and vocabulary flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8EBE3; --surface:#F7F8F3; --ink:#18203D; --muted:#596079; --line:#C7CCBF;
  --haldi:#C98A06; --right:#22694A; --right-soft:#D2E8DB; --wrong:#A3303D; --wrong-soft:#F2D6D9;
  --dev:"Tiro Devanagari Sanskrit","Noto Serif Devanagari","Kohinoor Devanagari","Nirmala UI","Mangal",serif;
  --ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10152A; --surface:#191F37; --ink:#ECE7D8; --muted:#A2A7BB; --line:#2E3554;
    --haldi:#F0B429; --right:#62C99A; --right-soft:#16382B; --wrong:#F27C88; --wrong-soft:#431F29;
  }
}
:root[data-theme="dark"]{
  --paper:#10152A; --surface:#191F37; --ink:#ECE7D8; --muted:#A2A7BB; --line:#2E3554;
  --haldi:#F0B429; --right:#62C99A; --right-soft:#16382B; --wrong:#F27C88; --wrong-soft:#431F29;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--haldi);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px}
.dev{font-family:var(--dev);font-weight:400}

/* masthead */
.mast{padding:6px 0 10px}
.mast h1{font-family:var(--dev);font-weight:400;font-size:clamp(2.4rem,10vw,3.3rem);line-height:1.15;margin:0}
.mast p{margin:0;color:var(--muted)}
h2{font-size:.95rem;font-weight:600;margin:30px 0 10px;color:var(--muted)}

/* deck list */
.decks{border-top:4px solid var(--ink);margin-top:18px}
.deck{display:grid;grid-template-columns:1fr auto;column-gap:12px;width:100%;padding:14px 2px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.deck .dn{font-family:var(--dev);font-size:1.55rem;line-height:1.25}
.deck .ct{color:var(--muted);font-size:.85rem;text-align:right;align-self:center;font-variant-numeric:tabular-nums}
.deck .en{grid-column:1/-1;font-weight:600}
.deck .sub{grid-column:1/-1;color:var(--muted);font-size:.9rem}
.meter{grid-column:1/-1;height:4px;background:var(--line);margin-top:10px}
.meter i{display:block;height:100%;background:var(--haldi)}
.deck:hover .dn{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}

/* chips and toggles */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:5px 13px;cursor:pointer;font-family:var(--dev);font-size:1.05rem;line-height:1.4}
.chip .n{font-family:var(--ui);font-size:.72rem;margin-left:5px;opacity:.65}
.cg{display:grid;grid-template-columns:6.6em 1fr;gap:8px;align-items:start;margin-bottom:10px}
.cgl{font-size:1.05rem;padding-top:5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.note{color:var(--muted);font-size:.85rem;margin:8px 0 0}
.links{display:flex;gap:18px;flex-wrap:wrap;margin-top:30px}
.link{background:none;border:0;padding:6px 0;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.link.quiet{color:var(--muted)}

/* play */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.top .streak{font-family:var(--dev);font-size:1.05rem;color:var(--ink)}
.prog{height:3px;background:var(--line);margin-top:6px}
.prog i{display:block;height:100%;background:var(--ink);transition:width .25s ease}
.card{background:var(--surface);border-top:9px solid var(--ink);padding:20px 20px 24px;margin:16px 0 18px;min-height:190px;display:flex;flex-direction:column;justify-content:center}
.card .big{font-family:var(--dev);font-size:clamp(2.6rem,13vw,3.7rem);line-height:1.2;word-break:break-word}
.card .meta{color:var(--muted);font-size:.9rem}
.card .ask{font-family:var(--dev);font-size:1.45rem;line-height:1.35;margin-top:14px}
.card .hint{color:var(--muted);font-size:.9rem}
.card .sent{font-family:var(--dev);font-size:clamp(1.6rem,7vw,2.1rem);line-height:1.5}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--haldi);text-align:center}
.blank.filled{border-color:transparent;background:var(--right-soft);padding:0 .2em}
.back{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.back .mean{font-size:1.25rem;font-weight:500}
.back .hi{font-family:var(--dev);font-size:1.3rem;color:var(--muted)}
.ex{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.ex .exs{font-family:var(--dev);font-size:1.3rem;line-height:1.5}
.ex .exs b{font-weight:400;border-bottom:2px solid var(--haldi)}
.ex .exe{margin-top:2px}
.ex .exw{color:var(--muted);font-size:.9rem;margin-top:6px}
.ex .dv{font-family:var(--dev);font-size:1.08rem}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font-family:var(--dev);font-size:1.45rem;line-height:1.3;padding:12px 8px;background:var(--surface);border:1.5px solid var(--line);border-top:3px solid var(--ink);cursor:pointer;min-height:66px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{background:var(--right-soft);border-color:var(--right);border-top-color:var(--right)}
.opt.wrong{background:var(--wrong-soft);border-color:var(--wrong);border-top-color:var(--wrong)}

.gridwrap{overflow-x:auto}
.grid{width:100%;border-collapse:collapse;table-layout:fixed;min-width:320px}
.grid th{font-weight:500;font-size:.8rem;color:var(--muted);padding:2px 3px 6px;text-align:center}
.grid th.row{font-family:var(--dev);font-size:1.05rem;color:var(--ink);width:4.6em;text-align:left;font-weight:400}
.grid td{padding:3px}
.cell{display:block;width:100%;min-height:46px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--dev);font-size:1.02rem;line-height:1.25;cursor:pointer;padding:6px 3px}
.cell:hover:not(:disabled){border-color:var(--ink)}
.cell:disabled{cursor:default}
.cell.hit{background:var(--right-soft);border-color:var(--right)}
.cell.miss{background:var(--wrong-soft);border-color:var(--wrong)}

.fb{margin:16px 0 0;min-height:1.5em}
.fb .verdict{font-weight:600}
.fb.ok .verdict{color:var(--right)}
.fb.no .verdict{color:var(--wrong)}
.fb .dv{font-family:var(--dev);font-size:1.12rem}
.primary{display:block;width:100%;padding:14px;background:var(--ink);color:var(--paper);border:0;font-weight:600;cursor:pointer;margin-top:16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pair .primary{margin:0}
.secondary{display:block;width:100%;padding:13px;background:transparent;border:1.5px solid var(--ink);font-weight:600;cursor:pointer}

/* end */
.misses{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.misses li{padding:10px 0;border-bottom:1px solid var(--line)}
.misses .q{font-family:var(--dev);font-size:1.1rem}
.misses .a{font-family:var(--dev);font-size:1.1rem;color:var(--right)}

/* reference */
.ref{width:100%;border-collapse:collapse;min-width:360px}
.ref th,.ref td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ref thead th{font-size:.8rem;font-weight:500;color:var(--muted);border-bottom:2px solid var(--ink)}
.ref td,.ref th.row{font-family:var(--dev);font-size:1.08rem;font-weight:400}
.ref .small{display:block;font-family:var(--ui);font-size:.75rem;color:var(--muted)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (min-width:520px){.card{padding:24px 28px 28px}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<script src="examples.js"></script>
<script>
/* ---------- data ---------- */
const CASES=[
 {dev:'प्रथमा',karaka:'कर्ता',en:'subject',hi:'— / ने'},
 {dev:'द्वितीया',karaka:'कर्म',en:'object',hi:'को'},
 {dev:'तृतीया',karaka:'करण',en:'instrument, agent',hi:'से, द्वारा'},
 {dev:'चतुर्थी',karaka:'सम्प्रदान',en:'recipient, purpose',hi:'को, के लिए'},
 {dev:'पञ्चमी',karaka:'अपादान',en:'source, separation',hi:'से (अलग होना)'},
 {dev:'षष्ठी',karaka:'सम्बन्ध',en:'possession, relation',hi:'का, के, की'},
 {dev:'सप्तमी',karaka:'अधिकरण',en:'location',hi:'में, पर'},
 {dev:'सम्बोधन',karaka:'—',en:'address',hi:'हे, अरे'}
];
const NUMS=['एकवचन','द्विवचन','बहुवचन'];
const NUMS_SHORT=['एक','द्वि','बहु'];
/* ---- declension templates: endings are appended to an a-final base (देव, मुन, पित...) ---- */
const TPL={
 'a-m':['ः ौ ाः','म् ौ ान्','ेन ाभ्याम् ैः','ाय ाभ्याम् ेभ्यः','ात् ाभ्याम् ेभ्यः','स्य योः ानाम्','े योः ेषु','_ ौ ाः'],
 'a-n':['म् े ानि','म् े ानि','ेन ाभ्याम् ैः','ाय ाभ्याम् ेभ्यः','ात् ाभ्याम् ेभ्यः','स्य योः ानाम्','े योः ेषु','_ े ानि'],
 'aa-f':['ा े ाः','ाम् े ाः','या ाभ्याम् ाभिः','ायै ाभ्याम् ाभ्यः','ायाः ाभ्याम् ाभ्यः','ायाः योः ानाम्','ायाम् योः ासु','े े ाः'],
 'i-m':['िः ी यः','िम् ी ीन्','िना िभ्याम् िभिः','ये िभ्याम् िभ्यः','ेः िभ्याम् िभ्यः','ेः ्योः ीनाम्','ौ ्योः िषु','े ी यः'],
 'i-f':['िः ी यः','िम् ी ीः','्या िभ्याम् िभिः','्यै|ये िभ्याम् िभ्यः','्याः|ेः िभ्याम् िभ्यः','्याः|ेः ्योः ीनाम्','्याम्|ौ ्योः िषु','े ी यः'],
 'i-n':['ि िनी ीनि','ि िनी ीनि','िना िभ्याम् िभिः','िने िभ्याम् िभ्यः','िनः िभ्याम् िभ्यः','िनः िनोः ीनाम्','िनि िनोः िषु','े|ि िनी ीनि'],
 'dadhi':['ि िनी ीनि','ि िनी ीनि','्ना िभ्याम् िभिः','्ने िभ्याम् िभ्यः','्नः िभ्याम् िभ्यः','्नः ्नोः ्नाम्','्नि|नि ्नोः िषु','े|ि िनी ीनि'],
 'ii-f':['ी ्यौ ्यः','ीम् ्यौ ीः','्या ीभ्याम् ीभिः','्यै ीभ्याम् ीभ्यः','्याः ीभ्याम् ीभ्यः','्याः ्योः ीनाम्','्याम् ्योः ीषु','ि ्यौ ्यः'],
 'u-m':['ुः ू वः','ुम् ू ून्','ुना ुभ्याम् ुभिः','वे ुभ्याम् ुभ्यः','ोः ुभ्याम् ुभ्यः','ोः ्वोः ूनाम्','ौ ्वोः ुषु','ो ू वः'],
 'u-f':['ुः ू वः','ुम् ू ूः','्वा ुभ्याम् ुभिः','्वै|वे ुभ्याम् ुभ्यः','्वाः|ोः ुभ्याम् ुभ्यः','्वाः|ोः ्वोः ूनाम्','्वाम्|ौ ्वोः ुषु','ो ू वः'],
 'u-n':['ु ुनी ूनि','ु ुनी ूनि','ुना ुभ्याम् ुभिः','ुने ुभ्याम् ुभ्यः','ुनः ुभ्याम् ुभ्यः','ुनः ुनोः ूनाम्','ुनि ुनोः ुषु','ो|ु ुनी ूनि'],
 'uu-f':['ूः ्वौ ्वः','ूम् ्वौ ूः','्वा ूभ्याम् ूभिः','्वै ूभ्याम् ूभ्यः','्वाः ूभ्याम् ूभ्यः','्वाः ्वोः ूनाम्','्वाम् ्वोः ूषु','ु ्वौ ्वः'],
 'r-rel':['ा रौ रः','रम् रौ ॄन्','्रा ृभ्याम् ृभिः','्रे ृभ्याम् ृभ्यः','ुः ृभ्याम् ृभ्यः','ुः ्रोः ॄनाम्','रि ्रोः ृषु','ः रौ रः'],
 'r-ag':['ा ारौ ारः','ारम् ारौ ॄन्','्रा ृभ्याम् ृभिः','्रे ृभ्याम् ृभ्यः','ुः ृभ्याम् ृभ्यः','ुः ्रोः ॄनाम्','रि ्रोः ृषु','ः ारौ ारः'],
 'r-relf':['ा रौ रः','रम् रौ ॄः','्रा ृभ्याम् ृभिः','्रे ृभ्याम् ृभ्यः','ुः ृभ्याम् ृभ्यः','ुः ्रोः ॄनाम्','रि ्रोः ृषु','ः रौ रः'],
 'r-agf':['ा ारौ ारः','ारम् ारौ ॄः','्रा ृभ्याम् ृभिः','्रे ृभ्याम् ृभ्यः','ुः ृभ्याम् ृभ्यः','ुः ्रोः ॄनाम्','रि ्रोः ृषु','ः ारौ ारः'],
 'vat':['ान् न्तौ न्तः','न्तम् न्तौ तः','ता द्भ्याम् द्भिः','ते द्भ्याम् द्भ्यः','तः द्भ्याम् द्भ्यः','तः तोः ताम्','ति तोः त्सु','न् न्तौ न्तः'],
 'in':['ी िनौ िनः','िनम् िनौ िनः','िना िभ्याम् िभिः','िने िभ्याम् िभ्यः','िनः िभ्याम् िभ्यः','िनः िनोः िनाम्','िनि िनोः िषु','िन् िनौ िनः'],
 'rajan':['ा ानौ ानः','ानम् ानौ ्नः','्ना भ्याम् भिः','्ने भ्याम् भ्यः','्नः भ्याम् भ्यः','्नः ्नोः ्नाम्','्नि|नि ्नोः सु','न् ानौ ानः'],
 'atman':['ा ानौ ानः','ानम् ानौ नः','ना भ्याम् भिः','ने भ्याम् भ्यः','नः भ्याम् भ्यः','नः नोः नाम्','नि नोः सु','न् ानौ ानः'],
 'naman':['_ ्नी|नी ानि','_ ्नी|नी ानि','्ना भ्याम् भिः','्ने भ्याम् भ्यः','्नः भ्याम् भ्यः','्नः ्नोः ्नाम्','्नि|नि ्नोः सु','न्|_ ्नी|नी ानि'],
 'karman':['_ नी ानि','_ नी ानि','ना भ्याम् भिः','ने भ्याम् भ्यः','नः भ्याम् भ्यः','नः नोः नाम्','नि नोः सु','न्|_ नी ानि'],
 'as':['ः सी ांसि','ः सी ांसि','सा ोभ्याम् ोभिः','से ोभ्याम् ोभ्यः','सः ोभ्याम् ोभ्यः','सः सोः साम्','सि सोः ःसु|स्सु','ः सी ांसि']
};
/* णत्व: न → ण after र, ष, ऋ, ॠ when only vowels, gutturals, labials, य व र ह or anusvara intervene, and न is not word-final */
const NT_TRIG='रषृॄऋॠ',NT_OK='कखगघङपफबभमयवरहंािीुूृॄेैोौ्अआइईउऊऋॠएऐओऔ';
function natva(s){
  let act=false,o='';
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(ch==='न'){
      let conv=act;
      if(conv&&s[i+1]==='्'){const n2=s[i+2];conv=!!n2&&'नमयव'.includes(n2);}
      o+=conv?'ण':'न';act=false;continue;
    }
    if(NT_TRIG.includes(ch))act=true;else if(!NT_OK.includes(ch))act=false;
    o+=ch;
  }
  return o;
}
const decline=(base,tpl)=>TPL[tpl].map(row=>row.split(' ').map(cell=>cell.split('|').map(e=>natva((base+(e==='_'?'':e)).replace(/ज्न/g,'ज्ञ'))).join('|')));
/* word rows: [id or '', stem, base, template, English, Hindi] */
const TYPES=[

(()=>{const GA={m:'पुं.',f:'स्त्री.',n:'नपुं.'},have=new Set(VOCAB.map(v=>v[0]));
 PARADIGMS.forEach(p=>{if(p.type==='pron')return;const nom=p.forms[0][0].split('|')[0];if(have.has(nom))return;have.add(nom);VOCAB.push([nom,`${GA[p.g]} (${p.word})`,p.gloss,p.hi])});})();
const DECKS=[
 {id:'form',dev:'रूपम्',en:'Build the form',sub:'See a noun with its case and number, then pick the right form.'},
 {id:'ident',dev:'अभिज्ञानम्',en:'Place the form',sub:'See a form, then tap its place in the table. Shared forms count anywhere they fit.'},
 {id:'sent',dev:'वाक्यम्',en:'Cases in sentences',sub:'Fill the gap with the form the sentence needs.'},
 {id:'vocab',dev:'शब्दकोशः',en:'Vocabulary',sub:'Flip the card, then mark whether you knew it.'}
];
const ROUND=12;

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIG='०१२३४५६७८९';
const dn=n=>String(n).replace(/\d/g,d=>DIG[d]);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const vars=f=>f.split('|');
const prim=f=>vars(f)[0];
const devSpans=t=>esc(t).replace(/([\u0900-\u097F][\u0900-\u097F\s+]*[\u0900-\u097F])/g,'<span class="dv">$1</span>');
const showF=(f,voc)=>vars(f).map(x=>(voc?'हे ':'')+x).join(' / ');
const pById=id=>PARADIGMS.find(p=>p.id===id);

/* ---------- storage: synced store when available, browser storage as fallback ---------- */
const LS_KEY='vibhakti-krida-v1';
let store={boxes:{},settings:{types:CASE_TYPES.map(t=>t.id),dir:'sa',vcat:['noun','verb','other']},updated:0};
function adopt(s){
  if(!s||typeof s!=='object')return;
  store.boxes=s.boxes&&typeof s.boxes==='object'?s.boxes:{};
  if(s.settings){
    const ty=(s.settings.types||[]).filter(id=>CASE_TYPES.some(t=>t.id===id));
    store.settings.types=ty.length?ty:CASE_TYPES.map(t=>t.id);
    const vc=(s.settings.vcat||['noun','verb','other']).filter(x=>['noun','verb','other'].includes(x));
    store.settings.vcat=vc.length?vc:['noun','verb','other'];
    store.settings.dir=s.settings.dir==='en'?'en':'sa';
  }
  store.updated=s.updated||0;
}
try{const raw=localStorage.getItem(LS_KEY); if(raw)adopt(JSON.parse(raw));}catch(e){}
let remote=null,tmr=null,inflight=false,pending=false;
function save(){
  store.updated=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){}
  if(remote){clearTimeout(tmr);tmr=setTimeout(flush,1500);}
}
async function flush(){
  if(!remote)return;
  if(inflight){pending=true;return}
  inflight=true;
  try{await remote.set({json:JSON.stringify(store),updated:store.updated});}catch(e){}
  inflight=false;
  if(pending){pending=false;flush();}
}
async function initRemote(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id(); if(!uid)return;
    const ref=db.collection('data/users/'+uid).doc('progress');
    const snap=await ref.get();
    remote=ref;
    if(snap.exists){
      const d=snap.data();
      if(d&&d.json&&(d.updated||0)>store.updated){
        adopt(JSON.parse(d.json));
        try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){}
        if(view==='home'||view==='ref')render();
      }else if(store.updated>(d&&d.updated||0)){flush();}
    }else if(store.updated){flush();}
  }catch(e){}
}

/* ---------- decks ---------- */
const vcat=v=>v[1].includes('√')?'verb':(v[1]==='अव्यय'||v[1]==='विशेषण')?'other':'noun';
const VCATS=[['noun','Nouns'],['verb','Verbs'],['other','Indeclinables and adjectives']];
function cards(deck){
  const act=PARADIGMS.filter(p=>store.settings.types.includes(p.type));
  const out=[];
  if(deck==='form'){
    act.forEach(p=>p.forms.forEach((row,c)=>row&&row.forEach((f,n)=>out.push({id:`form:${p.id}:${c}:${n}`,deck,p,c,n,f}))));
  }else if(deck==='ident'){
    act.forEach(p=>{const seen=new Set();p.forms.forEach(row=>row&&row.forEach(f=>{const x=prim(f);if(!seen.has(x)){seen.add(x);out.push({id:`ident:${p.id}:${x}`,deck,p,form:x})}}))});
  }else if(deck==='sent'){
    SENTS.forEach((s,i)=>out.push({id:`sent:${i}`,deck,s}));
  }else if(deck==='vocab'){
    const d=store.settings.dir;
    const vc=store.settings.vcat;
    VOCAB.forEach((v,i)=>{if(vc.includes(vcat(v)))out.push({id:`vocab:${i}:${d}`,deck,v,d})});
  }
  return out;
}
function mastery(deck){
  const all=cards(deck);
  const learned=all.filter(c=>(store.boxes[c.id]||0)>=3).length;
  return {learned,total:all.length};
}

/* ---------- round state ---------- */
let view='home',round=null,refSel='deva',refT='m-a',resetArmed=false;

function startRound(deck){
  const all=cards(deck);
  if(!all.length)return;
  const pick=all.map(c=>({c,k:(store.boxes[c.id]||0)+Math.random()*1.6})).sort((a,b)=>a.k-b.k).slice(0,ROUND).map(x=>x.c);
  round={deck,items:shuffle(pick).map(c=>({...c})),i:0,score:0,streak:0,best:0,misses:[],answered:false,flipped:false,pickedOk:null};
  view='play';render();window.scrollTo(0,0);
}
function grade(ok){
  const c=round.items[round.i];
  const b=store.boxes[c.id]||0;
  store.boxes[c.id]=ok?Math.min(5,b+1):1;
  if(ok){round.score++;round.streak++;round.best=Math.max(round.best,round.streak);}
  else{round.streak=0;round.misses.push(c);}
  round.answered=true;round.pickedOk=ok;
  save();
}
function next(){
  round.i++;round.answered=false;round.flipped=false;round.pickedOk=null;
  if(round.i>=round.items.length)view='end';
  render();
  const b=document.querySelector('.opt,.cell,[data-act="flip"]');
  if(b)b.focus({preventScroll:true});
}

/* question builders */
function formOptions(c){
  if(c.opts)return c.opts;
  const av=new Set(vars(c.f)),voc=c.c===7,seen=new Set([prim(c.f)]),pool=[];
  c.p.forms.forEach((row,ci)=>row&&row.forEach((f,ni)=>{
    const x=prim(f);
    if(seen.has(x)||vars(f).some(v=>av.has(v)))return;
    seen.add(x);
    pool.push({f,k:((ci===c.c||ni===c.n)?0:1)+Math.random()*0.9});
  }));
  const ds=pool.sort((a,b)=>a.k-b.k).slice(0,3).map(o=>o.f);
  c.opts=shuffle([c.f,...ds]).map(f=>({label:showF(f,voc),ok:f===c.f}));
  return c.opts;
}
function sentOptions(c){
  if(!c.opts)c.opts=shuffle(c.s.o.map((t,i)=>({label:t,ok:i===0})));
  return c.opts;
}
const cellMatches=(p,form)=>{const m=[];p.forms.forEach((row,ci)=>row&&row.forEach((f,ni)=>{if(vars(f).includes(form))m.push([ci,ni])}));return m};

/* ---------- views ---------- */
const GROUPS=[['m','पुंलिङ्ग'],['f','स्त्रीलिङ्ग'],['n','नपुंसकलिङ्ग'],['p','सर्वनाम']];
function typeChips(act,on){
  return GROUPS.map(([g,l])=>`<div class="cg"><span class="cgl dev">${l}</span><div class="chips">${CASE_TYPES.filter(t=>t.g===g).map(t=>`<button class="chip" data-act="${act}" data-t="${t.id}" aria-pressed="${on(t)}" title="${esc(t.label)}">${esc(g==='p'?'भवत्, तद्…':t.chip)}<span class="n">${t.count}</span></button>`).join('')}</div></div>`).join('');
}
function homeView(){
  const deckRows=DECKS.map(d=>{
    const m=mastery(d.id),pct=m.total?Math.round(m.learned/m.total*100):0;
    return `<button class="deck" data-act="deck" data-deck="${d.id}">
      <span class="dn">${d.dev}</span><span class="ct">${m.learned} of ${m.total} learned</span>
      <span class="en">${esc(d.en)}</span><span class="sub">${esc(d.sub)}</span>
      <span class="meter" aria-hidden="true"><i style="width:${pct}%"></i></span></button>`;
  }).join('');
  const chips=typeChips('toggleT',t=>store.settings.types.includes(t.id));
  const dir=store.settings.dir;
  return `<header class="mast"><h1>विभक्तिक्रीडा</h1><p>Flashcards for Sanskrit cases and vocabulary</p></header>
  <section class="decks" aria-label="Decks">${deckRows}</section>
  <h2>Word types in the case decks</h2>
  ${chips}
  <p class="note">The first two decks draw only from the stem types selected here. The small number is how many words each type has.</p>
  <h2>Vocabulary direction</h2>
  <div class="seg" role="group" aria-label="Vocabulary direction">
    <button data-act="dir" data-dir="sa" aria-pressed="${dir==='sa'}">Sanskrit to meaning</button>
    <button data-act="dir" data-dir="en" aria-pressed="${dir==='en'}">Meaning to Sanskrit</button>
  </div>
  <h2>Vocabulary includes</h2>
  <div class="chips">${VCATS.map(([k,l])=>`<button class="chip" style="font-family:var(--ui);font-size:.9rem" data-act="vcat" data-k="${k}" aria-pressed="${store.settings.vcat.includes(k)}">${l} (${VOCAB.filter(v=>vcat(v)===k).length})</button>`).join('')}</div>
  <p class="note">Each round picks ${ROUND} cards, favouring the ones you have missed or not yet seen. A card counts as learned after three correct answers in a row.</p>
  <div class="links">
    <button class="link" data-act="ref">Open the declension tables</button>
    <button class="link quiet" data-act="reset">${resetArmed?'Tap again to erase all progress':'Reset progress'}</button>
  </div>`;
}

function topBar(){
  const n=round.items.length,i=Math.min(round.i+1,n);
  return `<div class="top"><button class="link quiet" data-act="home">Quit round</button>
    <span>${i} of ${n}</span><span class="streak" title="Current streak">क्रम ${dn(round.streak)}</span></div>
    <div class="prog" aria-hidden="true"><i style="width:${(round.i+(round.answered?1:0))/n*100}%"></i></div>`;
}

function feedback(html){
  if(!round.answered)return '<div class="fb"></div>';
  const ok=round.pickedOk;
  return `<div class="fb ${ok?'ok':'no'}"><span class="verdict">${ok?'Correct.':'Not quite.'}</span> ${html}</div>
    <button class="primary" data-act="next">${round.i+1>=round.items.length?'See results':'Next card'}</button>`;
}

function optsHtml(opts){
  return `<div class="opts">${opts.map((o,i)=>{
    let cls='opt';
    if(round.answered){if(o.ok)cls+=' right';else if(o.picked)cls+=' wrong';}
    return `<button class="${cls}" data-act="opt" data-i="${i}" ${round.answered?'disabled':''}>${esc(o.label)}</button>`;
  }).join('')}</div>`;
}

function playView(){
  const c=round.items[round.i];
  let body='';
  if(c.deck==='form'){
    const opts=formOptions(c),cs=CASES[c.c];
    const alt=vars(c.f).length>1?` Both forms are accepted: <span class="dv">${esc(showF(c.f,c.c===7))}</span>.`:'';
    body=`<div class="card"><div class="big">${esc(c.p.word)}</div><div class="meta"><span class="dev">${esc(c.p.desc)}</span>, ${esc(c.p.gloss)}</div>
      <div class="ask">${cs.dev}, ${NUMS[c.n]}</div><div class="hint">${esc(cs.en)} (<span class="dev">${esc(cs.hi)}</span>)</div></div>
      ${optsHtml(opts)}
      ${feedback(round.pickedOk?alt.trim():`The form is <span class="dv">${esc(showF(c.f,c.c===7))}</span>.`)}`;
  }else if(c.deck==='ident'){
    const m=cellMatches(c.p,c.form),key=new Set(m.map(x=>x.join(',')));
    const rows=c.p.forms.map((row,ci)=>{
      if(!row)return '';
      return `<tr><th class="row" scope="row">${CASES[ci].dev}</th>${row.map((f,ni)=>{
        let cls='cell',label='';
        if(round.answered){
          label=esc(showF(f,ci===7));
          if(key.has(ci+','+ni))cls+=' hit';
          else if(round.tapped===ci+','+ni)cls+=' miss';
        }
        return `<td><button class="${cls}" data-act="cell" data-c="${ci}" data-n="${ni}" aria-label="${CASES[ci].dev} ${NUMS[ni]}" ${round.answered?'disabled':''}>${label}</button></td>`;
      }).join('')}</tr>`;
    }).join('');
    const where=m.map(([ci,ni])=>`${CASES[ci].dev} ${NUMS[ni]}`).join(', ');
    const fbText=m.length>1?`<span class="dv">${esc(c.form)}</span> fits ${m.length} places: <span class="dv">${where}</span>.`
      :`<span class="dv">${esc(c.form)}</span> is <span class="dv">${where}</span>.`;
    body=`<div class="card"><div class="big">${esc(c.form)}</div><div class="meta">from <span class="dev">${esc(c.p.word)}</span> (${esc(c.p.gloss)}), <span class="dev">${esc(c.p.desc)}</span></div></div>
      <div class="gridwrap"><table class="grid"><thead><tr><th></th>${NUMS_SHORT.map(n=>`<th class="dev" scope="col">${n}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
      ${feedback(fbText)}`;
  }else if(c.deck==='sent'){
    const opts=sentOptions(c),s=c.s,ans=s.o[0];
    const [a,b]=s.s.split('___');
    const blank=round.answered?`<span class="blank filled">${esc(ans)}</span>`:`<span class="blank" aria-label="blank">&nbsp;</span>`;
    body=`<div class="card"><div class="sent">${esc(a)}${blank}${esc(b)}</div>
      <div class="meta" style="margin-top:10px">Word: <span class="dev" style="font-size:1.1rem">${esc(s.w)}</span></div>
      ${round.answered?`<div class="hint" style="margin-top:6px">${esc(s.en)}</div>`:''}</div>
      ${optsHtml(opts)}
      ${feedback(`<span class="dv">${CASES[s.c].dev}</span>. ${devSpans(s.why)}`)}`;
  }else{
    const v=c.v,sa=c.d==='sa';
    const front=sa?`<div class="big">${esc(v[0])}</div><div class="meta dev">${esc(v[1])}</div>`
                  :`<div class="big" style="font-family:var(--ui);font-size:clamp(2rem,9vw,2.8rem);font-weight:500">${esc(v[2])}</div><div class="meta">Say it in Sanskrit</div>`;
    const back=sa?`<div class="mean">${esc(v[2])}</div><div class="hi">${esc(v[3])}</div>`
                 :`<div class="big" style="font-size:clamp(2.2rem,11vw,3rem)">${esc(v[0])}</div><div class="meta dev">${esc(v[1])}</div><div class="hi">${esc(v[3])}</div>`;
    const x=typeof EX!=='undefined'&&EX[v[0]];
    const ex=x?`<div class="ex"><div class="exs">${esc(x[0]).replace(/\{(.+?)\}/g,'<b>$1</b>')}</div><div class="exe">${esc(x[1])}</div><div class="exw">${devSpans(x[2])}</div></div>`:'';
    body=`<div class="card">${front}${round.flipped?`<div class="back">${back}${ex}</div>`:''}</div>`;
    if(!round.flipped)body+=`<button class="primary" data-act="flip">Show answer</button>`;
    else if(!round.answered)body+=`<div class="pair"><button class="secondary" data-act="self" data-ok="0">Not yet</button><button class="primary" data-act="self" data-ok="1">I knew it</button></div>`;
    else body+=`<button class="primary" data-act="next">${round.i+1>=round.items.length?'See results':'Next card'}</button>`;
  }
  return topBar()+body;
}

function missLine(c){
  if(c.deck==='form')return [`${c.p.word}, ${CASES[c.c].dev} ${NUMS[c.n]}`,showF(c.f,c.c===7)];
  if(c.deck==='ident')return [`${c.form} (${c.p.word})`,cellMatches(c.p,c.form).map(([ci,ni])=>`${CASES[ci].dev} ${NUMS[ni]}`).join(', ')];
  if(c.deck==='sent')return [c.s.s.replace('___','…'),`${c.s.o[0]} (${CASES[c.s.c].dev})`];
  return c.d==='sa'?[c.v[0],`${c.v[2]}; ${c.v[3]}`]:[c.v[2],c.v[0]];
}
function endView(){
  const n=round.items.length;
  const list=round.misses.length?`<h2>Review these</h2><ul class="misses">${round.misses.map(c=>{const [q,a]=missLine(c);return `<li><div class="q">${esc(q)}</div><div class="a">${esc(a)}</div></li>`}).join('')}</ul>`
    :`<p class="note">No misses this round.</p>`;
  return `<div class="card"><div class="big">${dn(round.score)} / ${dn(n)}</div>
    <div class="meta">${round.score} of ${n} correct. Longest streak: ${round.best}.</div></div>
    ${list}
    <div class="pair"><button class="secondary" data-act="home">Back to decks</button><button class="primary" data-act="again">Play another round</button></div>`;
}

function refView(){
  const t=CASE_TYPES.find(x=>x.id===refT)||CASE_TYPES[0];
  const words=PARADIGMS.filter(x=>x.type===t.id);
  const p=words.find(x=>x.id===refSel)||words[0];
  const chips=typeChips('refT',x=>x.id===t.id)+`<div class="chips" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">${words.map(x=>`<button class="chip" data-act="refP" data-p="${esc(x.id)}" aria-pressed="${x.id===p.id}">${esc(x.chip)}</button>`).join('')}</div>`;
  const rows=p.forms.map((row,ci)=>row?`<tr><th class="row" scope="row">${CASES[ci].dev}</th>${row.map(f=>`<td>${esc(showF(f,ci===7))}</td>`).join('')}</tr>`:'').join('');
  const roles=CASES.map(c=>`<tr><th class="row" scope="row">${c.dev}</th><td>${c.karaka}<span class="small">${esc(c.en)}</span></td><td>${c.hi}</td></tr>`).join('');
  return `<div class="top"><button class="link quiet" data-act="home">Back to decks</button><span></span></div>
  <header class="mast" style="margin-top:10px"><h1 style="font-size:clamp(2rem,8vw,2.6rem)">रूपतालिका</h1><p>Declension tables</p></header>
  <div style="margin-top:14px">${chips}</div>
  <h2><span class="dev" style="font-size:1.2rem;color:var(--ink)">${esc(p.word)}</span>, <span class="dev">${esc(p.desc)}</span>, ${esc(p.gloss)}</h2>
  <div class="gridwrap"><table class="ref"><thead><tr><th></th>${NUMS.map(n=>`<th class="dev" scope="col">${n}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
  ${NOTES[t.id]?`<p class="note dev" style="font-size:1rem;color:var(--ink)">${esc(NOTES[t.id])}</p>`:''}
  <p class="note">Where two forms are shown, the second is an accepted alternate (for pronouns, the shorter enclitic form).</p>
  <h2>What each case does</h2>
  <div class="gridwrap"><table class="ref"><thead><tr><th scope="col">विभक्ति</th><th scope="col">Role</th><th scope="col">Hindi</th></tr></thead><tbody>${roles}</tbody></table></div>
  <p class="note">षष्ठी marks relation (सम्बन्ध), which grammarians do not count as a kāraka.</p>`;
}

const app=document.getElementById('app');
function render(){
  if(view==='home')app.innerHTML=homeView();
  else if(view==='play')app.innerHTML=playView();
  else if(view==='end')app.innerHTML=endView();
  else app.innerHTML=refView();
}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const act=b.dataset.act;
  if(act!=='reset')resetArmed=false;
  switch(act){
    case 'deck':startRound(b.dataset.deck);break;
    case 'toggleT':{
      const id=b.dataset.t,a=store.settings.types;
      if(a.includes(id)){if(a.length>1)store.settings.types=a.filter(x=>x!==id);}
      else store.settings.types=CASE_TYPES.map(t=>t.id).filter(x=>x===id||a.includes(x));
      save();render();break;}
    case 'vcat':{
      const k=b.dataset.k,a=store.settings.vcat;
      if(a.includes(k)){if(a.length>1)store.settings.vcat=a.filter(x=>x!==k);}else store.settings.vcat=[...a,k];
      save();render();break;}
    case 'dir':store.settings.dir=b.dataset.dir;save();render();break;
    case 'ref':view='ref';render();window.scrollTo(0,0);break;
    case 'refP':refSel=b.dataset.p;render();break;
    case 'refT':refT=b.dataset.t;refSel='';render();break;
    case 'home':view='home';round=null;render();window.scrollTo(0,0);break;
    case 'again':startRound(round.deck);break;
    case 'reset':
      if(resetArmed){store.boxes={};resetArmed=false;save();}
      else resetArmed=true;
      render();break;
    case 'opt':{
      if(round.answered)return;
      const c=round.items[round.i],o=c.opts[+b.dataset.i];
      o.picked=true;grade(o.ok);render();focusNext();break;}
    case 'cell':{
      if(round.answered)return;
      const c=round.items[round.i],ci=+b.dataset.c,ni=+b.dataset.n;
      round.tapped=ci+','+ni;
      grade(vars(c.p.forms[ci][ni]).includes(c.form));render();focusNext();break;}
    case 'flip':round.flipped=true;render();{const k=app.querySelector('[data-act="self"][data-ok="1"]');if(k)k.focus({preventScroll:true});}break;
    case 'self':grade(b.dataset.ok==='1');render();focusNext();break;
    case 'next':next();break;
  }
});
function focusNext(){const n=app.querySelector('[data-act="next"]');if(n)n.focus({preventScroll:true});}
document.addEventListener('keydown',e=>{
  if(view!=='play'||!round||e.metaKey||e.ctrlKey||e.altKey)return;
  const c=round.items[round.i];
  if(/^[1-4]$/.test(e.key)&&!round.answered&&(c.deck==='form'||c.deck==='sent')){
    const btn=app.querySelectorAll('.opt')[+e.key-1]; if(btn){e.preventDefault();btn.click();}
  }else if(c.deck==='vocab'&&!round.answered&&round.flipped&&(e.key==='y'||e.key==='n')){
    e.preventDefault();app.querySelector(`[data-act="self"][data-ok="${e.key==='y'?1:0}"]`).click();
  }
});

render();
initRemote();
</script>
</body>
</html>
